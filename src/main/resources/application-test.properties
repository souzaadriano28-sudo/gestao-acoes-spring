# Configurações do Banco H2 (Memória)
spring.datasource.url=jdbc:h2:mem:gestaoacoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto do banco e Console Web
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria e apaga as tabelas toda vez que rodar (ideal para testes)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Valores deliberadamente fictícios; os testes substituem os provedores externos.
api.brapi.token=test-only-brapi-token
api.twelvedata.key=test-only-twelvedata-key
integrations.brapi.url=http://127.0.0.1:19090/brapi
integrations.twelvedata.url=http://127.0.0.1:19090/twelvedata
integrations.brasilapi.url=http://127.0.0.1:19090/brasilapi
integrations.viacep.url=http://127.0.0.1:19090/viacep
app.auth.initial-username=${ADMIN_INITIAL_USERNAME:atlas-test-admin}
app.auth.initial-password=${ADMIN_INITIAL_PASSWORD:Academic-test-password-123!}
server.servlet.session.cookie.secure=false
