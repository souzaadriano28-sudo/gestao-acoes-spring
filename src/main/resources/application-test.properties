# Configurações do Banco H2 (Memória)
spring.datasource.url=jdbc:h2:mem:gestaoacoes
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto do banco e Console Web
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria e apaga as tabelas toda vez que rodar (ideal para testes)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Valores deliberadamente fictícios; os testes substituem os provedores externos.
api.brapi.token=test-only-brapi-token
api.twelvedata.key=test-only-twelvedata-key
