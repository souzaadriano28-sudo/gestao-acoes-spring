spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USER}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
api.brapi.token=test-token
api.twelvedata.key=test-key
integrations.brapi.url=http://127.0.0.1:19090/brapi
integrations.twelvedata.url=http://127.0.0.1:19090/twelvedata
integrations.brasilapi.url=http://127.0.0.1:19090/brasilapi
integrations.viacep.url=http://127.0.0.1:19090/viacep
