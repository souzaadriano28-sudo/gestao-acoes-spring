# Define qual ambiente o Spring vai rodar agora (test ou dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test}

# Credenciais são fornecidas pelo ambiente nos perfis com integrações reais.
api.brapi.token=${BRAPI_TOKEN:}
api.twelvedata.key=${TWELVEDATA_API_KEY:}
integrations.brapi.url=${INTEGRATIONS_BRAPI_URL:https://brapi.dev/api}
integrations.twelvedata.url=${INTEGRATIONS_TWELVEDATA_URL:https://api.twelvedata.com}
integrations.brasilapi.url=${INTEGRATIONS_BRASILAPI_URL:https://brasilapi.com.br/api/cnpj/v1}
integrations.viacep.url=${INTEGRATIONS_VIACEP_URL:https://viacep.com.br/ws}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate

# Autenticação administrativa. As credenciais não possuem valor padrão funcional.
app.auth.initial-username=${ADMIN_INITIAL_USERNAME:}
app.auth.initial-password=${ADMIN_INITIAL_PASSWORD:}
app.auth.max-attempts=${AUTH_MAX_ATTEMPTS:5}
app.auth.attempt-window=${AUTH_ATTEMPT_WINDOW:PT15M}
app.auth.lock-duration=${AUTH_LOCK_DURATION:PT15M}
app.auth.origin-retention=${AUTH_ORIGIN_RETENTION:PT30M}
app.auth.trust-forwarded-headers=${AUTH_TRUST_FORWARDED_HEADERS:false}
server.servlet.session.timeout=${SESSION_IDLE_TIMEOUT:30m}
server.servlet.session.cookie.name=ATLAS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Expose only aggregate health for container orchestration.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Read models financeiros: janelas explícitas e fuso dos timestamps legados sem offset.
app.portfolio.quote-freshness=${PORTFOLIO_QUOTE_FRESHNESS:PT30M}
app.portfolio.exchange-freshness=${PORTFOLIO_EXCHANGE_FRESHNESS:PT36H}
app.portfolio.legacy-server-zone=${PORTFOLIO_LEGACY_SERVER_ZONE:America/Sao_Paulo}
# Sem valor padrão: totais USD/BRL dependem de observação PTAX rastreável e fresca.
app.portfolio.exchange.usd-brl.rate=${PORTFOLIO_USD_BRL_RATE:}
app.portfolio.exchange.usd-brl.provider=${PORTFOLIO_USD_BRL_PROVIDER:}
app.portfolio.exchange.usd-brl.reference-at=${PORTFOLIO_USD_BRL_REFERENCE_AT:}
app.portfolio.exchange.usd-brl.fetched-at=${PORTFOLIO_USD_BRL_FETCHED_AT:}
app.portfolio.exchange.mode=${PORTFOLIO_EXCHANGE_MODE:bcb-ptax}
app.portfolio.exchange.refresh-after=${PORTFOLIO_EXCHANGE_REFRESH_AFTER:PT1H}
app.portfolio.exchange.ptax-lookback-days=${PORTFOLIO_PTAX_LOOKBACK_DAYS:10}
integrations.bcb-ptax.url=${INTEGRATIONS_BCB_PTAX_URL:https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata}
spring.cloud.openfeign.client.config.bcb-ptax.connect-timeout=${BCB_PTAX_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.bcb-ptax.read-timeout=${BCB_PTAX_READ_TIMEOUT_MS:4000}
integrations.cvm-registry.url=${INTEGRATIONS_CVM_REGISTRY_URL:https://dados.cvm.gov.br/dados/INTERMED/CAD/DADOS}
spring.cloud.openfeign.client.config.cvm-registry.connect-timeout=${CVM_REGISTRY_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.cvm-registry.read-timeout=${CVM_REGISTRY_READ_TIMEOUT_MS:10000}
app.regulatory.cvm.freshness=${CVM_REGISTRY_FRESHNESS:P2D}
app.regulatory.cvm.refresh-cron=${CVM_REGISTRY_REFRESH_CRON:0 15 3 * * *}
